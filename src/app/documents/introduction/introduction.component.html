<mat-form-field appearance="outline" style="width: 100%">
  <mat-label>
    Search 10,000 options
  </mat-label>

  <ngx-mat-select
    clientSide
    [hasSearchBox]="true"
    [options]="options"
    optionLabel="name"
    dataKey="id"
    searchBoxPlaceholder="Type to filter…"
  >
  </ngx-mat-select>
</mat-form-field>
