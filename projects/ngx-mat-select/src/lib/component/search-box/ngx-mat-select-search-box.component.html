<div class="ngx-mat-select-search-box-icon">
  @if (!value) {
  <div>
    <ngx-mat-select-icon icon="Search"> </ngx-mat-select-icon>
  </div>
  } @if (!!value) {
  <button type="button" class="ngx-mat-select-search-box-clear" [attr.aria-label]="clearAriaLabel" (click)="clear()">
    <ngx-mat-select-icon icon="Times"> </ngx-mat-select-icon>
  </button>
  }
</div>

<input
  (blur)="_onBlur()"
  (focus)="_onFocus()"
  class="ngx-mat-select-search-box-input"
  type="text"
  #searchBox
  [(ngModel)]="value"
  [placeholder]="placeholder || ''"
  [attr.aria-label]="ariaLabel"
  [attr.aria-controls]="controls"
  [attr.aria-activedescendant]="activeDescendant"
  aria-autocomplete="list"
  (keydown)="handleKeydown.emit($event)"
/>
