name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22.14.0'
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --progress=false

      - name: Build package
        run: npm run build:library

      - name: Verify public API
        run: node scripts/verify-public-api.mjs

      - name: Verify release version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./dist/ngx-mat-select/package.json').version")"
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"

      - name: Publish with npm provenance
        working-directory: dist/ngx-mat-select
        run: npm publish --access public
