name: Build

on:
  pull_request:
  push:
    branches-ignore: ['master']

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node 22.x
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build:ci
      - name: Test
        run: npm test -- --progress=false
      - name: Verify Angular 20 consumer and SSR build
        run: npm run verify:consumer:20
      - name: Archive build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
